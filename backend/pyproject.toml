[project]
name = "contextkey-backend"
version = "0.1.0"
description = "BeforePay modular monolith API"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.119,<1",
  "uvicorn>=0.38,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "sqlalchemy>=2.0.44,<2.1",
  "alembic>=1.17,<2",
  "psycopg[binary]>=3.2.12,<4",
  "httpx>=0.28,<1",
  "pymupdf>=1.26.5,<2",
  "python-multipart>=0.0.20,<1",
  "google-genai>=2.34,<3",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
